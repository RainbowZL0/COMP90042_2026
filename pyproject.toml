[project]
name = "comp90042-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.8",
    "numpy>=2.4.4",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

# ---- pytest config ----
# `pythonpath = ["."]` lets `from src.data.schema import ...` resolve when
# running `pytest` from the project root, without needing to install the
# project as an editable package.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
pythonpath = ["."]
